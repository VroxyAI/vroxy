[project]
name = "vroxy"
version = "0.45.0"
description = "The vroxy CLI, and the dispatch agent that runs coding agents against your workspace"
requires-python = ">=3.9"

# The CLI is stdlib-only on purpose: `pipx install vroxy` should not
# compile or download anything.  The dispatch agent's websockets
# dependency lives in an extra so it never reaches a CLI-only install.
dependencies = []

[project.optional-dependencies]
dispatch = ["websockets>=12.0,<14"]

[project.scripts]
vroxy = "vroxy_cli.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vroxy_cli*"]
